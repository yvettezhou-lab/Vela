<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172942" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="/vela-icon-1024-no-white-border.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vela</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const show = (label, value) => {
          const message = value instanceof Error
            ? value.stack || value.message
            : String(value);
          const panel = document.createElement('pre');
          panel.setAttribute('data-vela-debug-error', 'true');
          panel.textContent = label + '\n\n' + message;
          panel.style.cssText = 'position:fixed;inset:12px;z-index:2147483647;margin:0;padding:16px;overflow:auto;background:#fff;color:#8b0000;border:2px solid #8b0000;border-radius:12px;font:12px/1.45 ui-monospace,monospace;white-space:pre-wrap;';
          document.body.appendChild(panel);
        };
        window.addEventListener('error', (event) => {
          show('Vela runtime error', event.error || event.message);
        });
        window.addEventListener('unhandledrejection', (event) => {
          show('Vela unhandled rejection', event.reason);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
