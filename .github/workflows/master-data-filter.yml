name: Apply master data dropdown filters
on:
  push:
    branches: [hotfix/v1-master-data]
jobs:
  filter:
    if: contains(github.event.head_commit.message, 'feat: add master data active filters')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v1-master-data
          fetch-depth: 0
      - name: Filter archived master data from new-entry selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/QuickEntry/index.tsx')
          s = p.read_text()
          s = s.replace("const accounts = currentTrip?.accounts.length ? currentTrip.accounts : FALLBACK_ACCOUNTS;", "const activeAccounts = currentTrip?.accounts.filter((account) => account.archived !== true) ?? [];\n  const accounts = activeAccounts.length ? activeAccounts : FALLBACK_ACCOUNTS;")
          s = s.replace("const members = currentTrip?.members.length ? currentTrip.members : FALLBACK_MEMBERS;", "const activeMembers = currentTrip?.members.filter((member) => member.archived !== true) ?? [];\n  const members = activeMembers.length ? activeMembers : FALLBACK_MEMBERS;")
          s = s.replace("currentTrip.categories.map((category) =>", "currentTrip.categories.filter((category) => category.archived !== true).map((category) =>")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/QuickEntry/index.tsx
          git diff --cached --quiet || git commit -m "fix: hide archived master data from new entries"
          git push
