name: Force clean legacy HomePage
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.tsx'); s=p.read_text()
          start=s.find('function HomePage(')
          if start>=0:
            end=s.find('\nfunction LedgerPage(',start)
            s=s[:start]+s[end+1:]
            s=s.replace(":tab==='Home'?<HomePage plan={plan} onQuick={()=>setQuick(true)} onPlan={()=>setManage('plan')} onCategory={selectCategory}/>",":tab==='Home'?null")
            p.write_text(s)
          PY
          npm ci && npm run build
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.tsx
          git commit -m 'Remove legacy HomePage implementation' || true
          git push
          git rm .github/workflows/force-clean.yml || true
          git commit -m 'Remove temporary cleanup workflow' || true
          git push
